<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Pikachu</title>
    <!-- gg font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="header">
            <div id="title">
                <img src="./image/logo1.png" alt="logo game">
            </div>
            <div id="time">
                <div id="time-head">
                    <p>THỜI GIAN</p>
                    <p>02:00</p>
                </div>
                <div id="time-bar"></div>
            </div>
            <div class="score">
                <div id="score-group">
                    <p>ĐIỂM</p>
                    <p id="score">0</p>
                </div>
                <div id="bar">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
        <div id="body">
            <div id="left">
                <div class="item" id="level-menu-btn">
                    <p>Cấp Độ</p>
                    <span id="level">1</span>
                    <!-- menu chọn lv -->
                    <div id="level-dropdown" class="level-dropdown-hidden">
                        <div data-lvl="1">Cấp Độ 1 (Cơ bản)</div>
                        <div data-lvl="2">Cấp Độ 2 (Trọng lực)</div>
                        <div data-lvl="3">Cấp Độ 3 (Vật cản)</div>
                        <div data-lvl="4">Cấp Độ 4 (Ẩn hiện)</div>
                        <div data-lvl="5">Cấp Độ 5 (Bom hẹn giờ)</div>
                        <div data-lvl="6">Cấp Độ 6 (Băng Chuyền)</div>
                        <div data-lvl="7">Cấp Độ 7 (Trọng lực + Vật cản)</div>
                        <div data-lvl="8">Cấp Độ 8 (Ẩn hiện + Bom)</div> 
                    </div>
                </div>
                <div class="item" id="hint-btn">
                    <p>Gợi Ý</p>
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <div class="item" id="shuffle-btn">
                    <p>Xáo Trộn</p>
                    <i class="fa-solid fa-shuffle"></i>
                </div>
                <div class="item" id="pause">
                    <p>Đóng Băng</p>
                    <i class="fa-regular fa-snowflake"></i>
                </div>
            </div>
            <!-- Grid chứa ma trận game -->
            <div id="game-board" class="neon-panel"></div>
            <div id="right">
                <div class="count-die">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
        </div>
        <div id="footer"></div>
    </div>
</body>
<script src="main.js"></script>

</html>
